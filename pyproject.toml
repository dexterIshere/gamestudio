[project]
name = "gamestudio"
# Read from gamestudio/__init__.py: a single number to change.
dynamic = ["version"]
description = "Game asset studio: world card -> concepts -> 3D mesh -> rig and animation by an agent -> sprites and Godot export"
requires-python = ">=3.11"
# The studio is under PolyForm Shield; the scripts run inside Blender
# (`src/gamestudio/blender/bl_*.py`) are under GPL 3.0 or later. Details, and
# the third-party material that keeps its own licence: docs/THIRD_PARTY_NOTICES.md.
license = "LicenseRef-PolyForm-Shield-1.0.0 AND GPL-3.0-or-later"
license-files = ["LICENSE", "docs/THIRD_PARTY_NOTICES.md", "src/gamestudio/blender/LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.3",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Local vision tools: RTMPose pose estimation (rtmlib), which checks that a
# concept holds the imposed pose, and background removal (rembg). Optional:
# without them the pose is not measured and background removal comes from
# Runware. The studio does not import OpenCV itself: rtmlib pulls it in.
rigtools = [
    "rtmlib>=0.0.13",
    "onnxruntime>=1.20",
    "rembg>=2.0",
]
# Rasterising SVG icons to PNG. Splitting a multi-icon sheet needs nothing:
# it is XML parsing and geometry.
vector = ["cairosvg>=2.7"]

[project.scripts]
gamestudio = "gamestudio.cli:app"

[build-system]
# PEP 639: `license-files` as a list of paths (hatchling 1.26) and metadata
# 2.4 by default, which carries the SPDX expression (`License-Expression`, 1.27).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gamestudio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gamestudio"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The scripts run inside Blender run under Blender's interpreter and import
# `bpy`: linting them against the venv makes no sense.
extend-exclude = ["src/gamestudio/blender/bl_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    # Typer declares its options as default values: the library's idiom, not a
    # shared-mutable trap.
    "B008",
    # int() on an already-integer value documents the intent when the source is
    # an external API with loose typing (JSON, numpy).
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
